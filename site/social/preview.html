<!doctype html>
<!-- The GitHub social preview, 1280×640. Render it with
     `node site/social/render.mjs`; it writes site/social/preview.png. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 640px;
      }
      body {
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(900px 520px at 0% 0%, #0f2e2c 0%, transparent 70%),
          #0e1518;
        color: #f1f5f6;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      .copy {
        position: absolute;
        left: 80px;
        top: 76px;
        width: 560px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .brand svg {
        width: 56px;
        height: 56px;
      }
      .brand span {
        font-size: 36px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      h1 {
        margin-top: 56px;
        font-size: 54px;
        line-height: 1.06;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      h1 em {
        font-style: normal;
        color: #2dd4bf;
      }
      p {
        margin-top: 28px;
        font-size: 24px;
        line-height: 1.4;
        color: #b7c2c6;
      }
      .foot {
        position: absolute;
        left: 80px;
        bottom: 60px;
        font-size: 20px;
        color: #8b989d;
      }
      .foot b {
        color: #dfe6e8;
        font-weight: 600;
      }
      .shot {
        position: absolute;
        left: 700px;
        top: 96px;
        width: 680px;
        height: 560px;
        border: 1px solid #29343a;
        border-radius: 18px;
        overflow: hidden;
        background: #18181b url(../../docs/screenshots/board-dark.png) no-repeat;
        background-size: 1088px auto;
        background-position: 14px -176px;
        box-shadow: 0 30px 80px -20px rgb(0 0 0 / 0.6);
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand">
        <svg viewBox="0 0 32 32" fill="none">
          <rect x="2" y="2" width="28" height="28" rx="8" fill="#0f766e" />
          <path
            d="M9 11h8M9 16h5M9 21h4"
            stroke="#fff"
            stroke-width="2.2"
            stroke-linecap="round"
            opacity=".55"
          />
          <path
            d="m16.5 20 3 3 6-7.5"
            stroke="#fff"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span>Evalkeeper</span>
      </div>
      <h1>
        Know when your AI features get worse <em>before your users do.</em>
      </h1>
      <p>
        Open-source evals for TypeScript apps. Test against answers your team
        confirms, and compare models on accuracy, cost, and speed.
      </p>
    </div>
    <div class="foot">npm i <b>@crowandraven/evalkeeper</b> · MIT</div>
    <div class="shot"></div>
  </body>
</html>
